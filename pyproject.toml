[project]
name = "pvewarden"
version = "0.1.3"
description = "Agent-safe patching of Proxmox VE guests over MCP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "matty" }]
keywords = ["proxmox", "mcp", "patching", "unattended-upgrades", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/matousfiser/pvewarden"
Issues = "https://github.com/matousfiser/pvewarden/issues"

[project.scripts]
pvewarden = "pvewarden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "shellcheck-py>=0.11.0.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvewarden"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
# timeouts as parameters are deliberate; log writes are small line-buffered appends
ignore = ["ASYNC109", "ASYNC230"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker and network (run with -m integration)"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# test data (long literal outputs) and fakes may break these
"tests/**" = ["E501", "ASYNC240"]
