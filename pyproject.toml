[project]
name = "pvewarden"
version = "0.1.0.dev0"
description = "Agent-safe patching of Proxmox VE guests over MCP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "matty" }]
keywords = ["proxmox", "mcp", "patching", "unattended-upgrades", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]

[project.scripts]
pvewarden = "pvewarden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvewarden"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
# timeouts as parameters are deliberate; log writes are small line-buffered appends
ignore = ["ASYNC109", "ASYNC230"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
