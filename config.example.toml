# pvewarden server configuration (/etc/pvewarden/config.toml).
# Readable only by root and the pvewarden service user: it contains secrets.

# Audit log, per-run update logs, SSH known_hosts and the guests' SSH keys (keys/<vmid>)
state_dir = "/var/lib/pvewarden"

[proxmox]
# Must match a name in the Proxmox certificate (map it in /etc/hosts if needed)
host = "pve.example.lan"
port = 8006
# API token of a user whose role is granted only on the pvewarden pool
token_id = "pvewarden@pve!server"
# Or set $PVEWARDEN_PROXMOX_TOKEN_SECRET instead
token_secret = "CHANGE_ME"
# CA bundle for the Proxmox certificate (copy of /etc/pve/pve-root-ca.pem), or true / false
verify_tls = "/etc/pvewarden/pve-root-ca.pem"

[ssh]
user = "pvewarden"
# Every guest has its own key in state_dir/keys, made when it is enrolled (pvewarden-enroll, or
# by hand: pvewarden key new|verify|activate <vmid>). A shared key is possible only for guests
# whose address is set in [addresses] (or static_guests), never for addresses a guest reports:
# key = "/etc/pvewarden/id_ed25519"
# Prefer guest addresses from these networks (guest agent / LXC may report several)
subnets = ["192.0.2.0/24"]
parallel = 5
connect_timeout = 10

[policy]
tag_update = "pvewarden-update"
tag_reboot = "pvewarden-reboot"
# Rollback, snapshot deletion and updates without a snapshot are confirmed by the user in the
# MCP client, not by the agent:
#   "required"      ask; refuse if the client cannot ask (no MCP elicitation support)
#   "if-supported"  ask when the client can, otherwise go ahead
#   "off"           never ask
confirm_destructive = "required"

[http]
# Address to listen on: keep it on a VPN or management network
listen = "192.0.2.10"
port = 8765
# Other names clients use to reach this server (must match what they put in the URL)
# hostnames = ["pvewarden.example.lan"]
# HTTPS: recommended whenever the network between agent and server is not already encrypted (VPN)
# tls_cert = "/etc/pvewarden/tls.crt"
# tls_key = "/etc/pvewarden/tls.key"
# The CA that signed tls_cert. Public; served without a token at /ca.pem, so clients can fetch it
# and check its SHA-256 instead of copying it (pvewarden-setup prints the command).
# tls_ca = "/etc/pvewarden/tls-ca.pem"

[http.clients]
# name = "token" (at least 32 characters); the name is written to the audit log.
# Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
agent = "CHANGE_ME"

# Optional fixed guest addresses, when discovery is not enough
# [addresses]
# 108 = "192.0.2.45"

# Testing without Proxmox: drop [proxmox] and list guests by hand.
# Snapshots, reboots and rollbacks are unavailable in this mode.
# [[static_guests]]
# vmid = 1
# name = "test"
# address = "192.0.2.50"
# type = "lxc"
# tags = ["pvewarden-update"]
