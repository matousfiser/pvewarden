<rect width="960" height="30" rx="10" fill="#2a2a2a"/><rect y="20" width="960" height="10" fill="#2a2a2a"/>
<circle cx="20" cy="15" r="5.5" fill="#ff5f57"/><circle cx="38" cy="15" r="5.5" fill="#febc2e"/><circle cx="56" cy="15" r="5.5" fill="#28c840"/>
<text x="480.0" y="19.5" text-anchor="middle" fill="#8c8c8c" style="font-size:12px">claude — pvewarden demo · real run, guest names shortened</text>
<g class="a1"><text x="47.9" y="736"><tspan fill="#e6e6e6">What updates are pending?</tspan></text><rect class="t2" x="46.9" y="720" width="212.8" height="22" fill="#1a1a1a"/><rect class="t2" x="47.9" y="723" width="8.0" height="17" fill="#e6e6e6" opacity=".7"/></g>
<text class="a3" x="20.0" y="50.0"><tspan fill="#a6a6a6">&gt; What updates are pending?</tspan></text>
<g class="a4"><text x="20" y="702"><tspan class="pulse" fill="#d77757">✻ </tspan><tspan fill="#d77757">Checking… </tspan><tspan fill="#8c8c8c">(esc to interrupt)</tspan></text></g>
<text class="a5" x="20.0" y="80.0"><tspan fill="#8c8c8c">●</tspan><tspan fill="#e6e6e6" font-weight="bold"> pvewarden - check_updates (MCP)</tspan><tspan fill="#e6e6e6"></tspan></text>
<text class="a6" x="20.0" y="80.0"><tspan fill="#4eba65">●</tspan><tspan fill="#e6e6e6" font-weight="bold"> pvewarden - check_updates (MCP)</tspan><tspan fill="#e6e6e6"></tspan></text>
<text class="a7" x="20.0" y="100.0"><tspan fill="#8c8c8c">  ⎿  </tspan><tspan fill="#8c8c8c">{"guests": [{"vmid": 100, "name": "lb", "os": "Ubuntu 22.04.5 LTS", "pending": 3, …</tspan></text>
<text class="a8" x="20.0" y="120.0"><tspan fill="#8c8c8c">     … +1990 lines (ctrl+o to expand)</tspan></text>
<text class="a9" x="20.0" y="150.0"><tspan fill="#e6e6e6">● </tspan><tspan fill="#e6e6e6">6 guests checked. Security updates are pending on two:</tspan></text>
<text class="a10" x="20.0" y="170.0"><tspan fill="#e6e6e6">  </tspan><tspan fill="#e6e6e6">- ct101 git (Ubuntu 22.04): 6 updates, 4 security (apt). forgejo comes from a third-party repo.</tspan></text>
<text class="a11" x="20.0" y="190.0"><tspan fill="#e6e6e6">  </tspan><tspan fill="#e6e6e6">- vm106 web (Ubuntu 24.04): 94 updates, 4 security. A reboot is already pending.</tspan></text>
<text class="a12" x="20.0" y="210.0"><tspan fill="#e6e6e6">  </tspan><tspan fill="#e6e6e6">- vm103 jump, ct100 lb, vm107 app, vm111 agent: 2–11 regular updates, nothing security-related.</tspan></text>
<text class="a13" x="20.0" y="230.0"><tspan fill="#e6e6e6">  </tspan><tspan fill="#e6e6e6">Docker, Node.js, Jenkins and Telegraf come from third-party repos: reported, never installed.</tspan></text>
<g class="a14"><text x="47.9" y="736"><tspan fill="#e6e6e6">Install the security updates on ct101.</tspan></text><rect class="t15" x="46.9" y="720" width="316.1" height="22" fill="#1a1a1a"/><rect class="t15" x="47.9" y="723" width="8.0" height="17" fill="#e6e6e6" opacity=".7"/></g>
<text class="a16" x="20.0" y="260.0"><tspan fill="#a6a6a6">&gt; Install the security updates on ct101.</tspan></text>
<g class="a17"><text x="20" y="702"><tspan class="pulse" fill="#d77757">✻ </tspan><tspan fill="#d77757">Updating… </tspan><tspan fill="#8c8c8c">(esc to interrupt)</tspan></text></g>
<text class="a18" x="20.0" y="290.0"><tspan fill="#8c8c8c">●</tspan><tspan fill="#e6e6e6" font-weight="bold"> pvewarden - apply_updates (MCP)</tspan><tspan fill="#e6e6e6">(vmid: 101, mode: "security")</tspan></text>
<text class="a19" x="20.0" y="290.0"><tspan fill="#4eba65">●</tspan><tspan fill="#e6e6e6" font-weight="bold"> pvewarden - apply_updates (MCP)</tspan><tspan fill="#e6e6e6">(vmid: 101, mode: "security")</tspan></text>
<text class="a20" x="20.0" y="310.0"><tspan fill="#8c8c8c">  ⎿  </tspan><tspan fill="#8c8c8c">{"vmid": 101, "snapshot": "pvewarden_20261105_123003", "ok": true, "reboot_required": false, …</tspan></text>
<text class="a21" x="20.0" y="330.0"><tspan fill="#8c8c8c">     … +22 lines (ctrl+o to expand)</tspan></text>
<text class="a22" x="20.0" y="360.0"><tspan fill="#e6e6e6">● </tspan><tspan fill="#e6e6e6">Done. ct101 got 4 packages (apt 2.4.14 → 2.4.15ubuntu0.1) in 30 s, after snapshot</tspan></text>
<text class="a23" x="20.0" y="380.0"><tspan fill="#e6e6e6">  </tspan><tspan fill="#e6e6e6">pvewarden_20261105_123003. Services are running, no reboot needed.</tspan></text>
<g class="a24"><text x="47.9" y="736"><tspan fill="#e6e6e6">Roll ct101 back to that snapshot.</tspan></text><rect class="t25" x="46.9" y="720" width="276.4" height="22" fill="#1a1a1a"/><rect class="t25" x="47.9" y="723" width="8.0" height="17" fill="#e6e6e6" opacity=".7"/></g>
<text class="a26" x="20.0" y="410.0"><tspan fill="#a6a6a6">&gt; Roll ct101 back to that snapshot.</tspan></text>
<g class="a27"><text x="20" y="702"><tspan class="pulse" fill="#d77757">✻ </tspan><tspan fill="#d77757">Rolling back… </tspan><tspan fill="#8c8c8c">(esc to interrupt)</tspan></text></g>
<text class="a28" x="20.0" y="440.0"><tspan fill="#8c8c8c">●</tspan><tspan fill="#e6e6e6" font-weight="bold"> pvewarden - rollback_snapshot (MCP)</tspan><tspan fill="#e6e6e6">(vmid: 101, snapshot: "pvewarden_20261105_123003")</tspan></text>
<text class="a29" x="20.0" y="440.0"><tspan fill="#ff6b80">●</tspan><tspan fill="#e6e6e6" font-weight="bold"> pvewarden - rollback_snapshot (MCP)</tspan><tspan fill="#e6e6e6">(vmid: 101, snapshot: "pvewarden_20261105_123003")</tspan></text>
<rect class="a30" x="20" y="714" width="920" height="34" rx="6" fill="none" stroke="#555555" stroke-width="1"/>
<text class="a31" x="32.0" y="736.0"><tspan fill="#e6e6e6">&gt; </tspan></text>
<text class="a32" x="32.0" y="764.0"><tspan fill="#8c8c8c">? for shortcuts</tspan></text>
<rect class="a33" x="20" y="714" width="920" height="34" rx="6" fill="none" stroke="#555555" stroke-width="1"/>
<text class="a34" x="32.0" y="736.0"><tspan fill="#e6e6e6">&gt; </tspan></text>
<text class="a35" x="32.0" y="764.0"><tspan fill="#8c8c8c">? for shortcuts</tspan></text>
<rect class="a36" x="20" y="590" width="920" height="170" rx="6" fill="#1a1a1a" stroke="#b1b9f9" stroke-width="1"/>
<text class="a37" x="34.0" y="614.0"><tspan fill="#b1b9f9" font-weight="bold">MCP server pvewarden asks for confirmation</tspan></text>
<text class="a38" x="34.0" y="642.0"><tspan fill="#e6e6e6">Roll back git (VMID 101) to snapshot pvewarden_20261105_123003, taken 2026-11-05</tspan></text>
<text class="a39" x="34.0" y="662.0"><tspan fill="#e6e6e6">12:30 UTC (before security updates)? Everything written on the guest since then is lost.</tspan></text>
<text class="a40" x="34.0" y="690.0"><tspan fill="#e6e6e6">Yes, do it  </tspan><tspan fill="#8c8c8c">[ ]</tspan></text>
<text class="a41" x="34.0" y="718.0"><tspan fill="#b1b9f9">❯ Accept</tspan></text>
<text class="a42" x="34.0" y="718.0"><tspan fill="#e6e6e6">  Accept</tspan></text>
<text class="a43" x="34.0" y="738.0"><tspan fill="#e6e6e6">  Decline</tspan></text>
<text class="a44" x="34.0" y="738.0"><tspan fill="#b1b9f9">❯ Decline</tspan></text>
<text class="a45" x="34.0" y="758.0"><tspan fill="#e6e6e6">  Cancel</tspan></text>
<text class="a46" x="20.0" y="460.0"><tspan fill="#8c8c8c">  ⎿  </tspan><tspan fill="#ff6b80">Error: the user did not confirm this action; nothing was changed</tspan></text>
<text class="a47" x="20.0" y="490.0"><tspan fill="#e6e6e6">● </tspan><tspan fill="#e6e6e6">You declined, so nothing was rolled back. ct101 stays updated and the snapshot is kept.</tspan></text>
</svg>
