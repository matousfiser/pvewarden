name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the same checks first

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # the server installs from requirements.lock: it must match uv.lock (Dependabot only updates uv.lock)
      - name: requirements.lock matches uv.lock
        run: |
          uv export --frozen --no-hashes --no-dev --no-emit-project -o requirements.lock
          git diff --exit-code requirements.lock || {
            echo "::error::requirements.lock is out of date: run uv export --frozen --no-hashes --no-dev --no-emit-project -o requirements.lock"
            exit 1
          }
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run shellcheck guest/install.sh guest/pvewarden-guest guest/pvewarden-gate proxmox/pvewarden-enroll proxmox/pvewarden-setup deploy/install-server.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    # real guest client in Ubuntu containers: install.sh, sshd forced command, sudoers, apt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -m integration tests/integration
